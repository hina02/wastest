[package]
name = "wastest"
version = "0.1.0"
edition = "2024"
default-run = "wastest"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow = "58.3.0"
duckdb = { version = "1.10503.1", features = ["bundled"] }
iceberg = "0.9.1"
opendal = "0.56.0"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3.31"
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.18"
wasm-bindgen = "0.2.121"
bloomfilter = "3.0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.102"
dotenvy = "0.15"
chrono = "0.4.44"
secrecy = { version = "0.10.3", features = ["serde"] }
envy = "0.4.2"
rig-core = "0.21"
scraper = "0.23.1"
url = "2.5.4"
tiktoken-rs = "0.11.0"

[profile.release]
opt-level = "s" # サイズ最適化
lto = true
