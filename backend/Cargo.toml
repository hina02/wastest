[package]
name = "wastest"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow = "58.3.0"
duckdb = "1.10503.1"
iceberg = "0.9.1"
opendal = "0.56.0"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3.31"
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.18"
wasm-bindgen = "0.2.121"

[profile.release]
opt-level = "s" # サイズ最適化
lto = true
